<app-page-header [title]="title()" [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Inventory' }, { label: title() }]">
  <div class="d-flex justify-content-between align-items-center flex-wrap">
    <a *appHasPermission="'Transactions.All'" [routerLink]="['../', typeId, 'new']" class="btn btn-outline-primary">
      <i class="bi bi-plus-lg"></i> Add
    </a>

    <div class="search-text" style="max-width: 260px;">
      <input
        type="text"
        class="form-control"
        placeholder="Search..."
        [ngModel]="keySearch()"
        (ngModelChange)="keySearch.set($event)"
        (keyup.enter)="onSearch()"
      />
    </div>
  </div>
</app-page-header>

<div class="card">
  <div class="card-body p-0">
    <table class="table table-hover m-0" *ngIf="transactions().length; else emptyState">
      <thead>
        <tr>
          <th>Code</th>
          <th>Date</th>
          <th>Dealer</th>
          <th>Stock</th>
          <th *ngIf="typeId === TransactionTypeId.Transfer">To Stock</th>
          <th>Total</th>
          <th>Status</th>
          <th style="width: 140px;"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of transactions()" [class.text-muted]="t.status === Status.Cancel">
          <td>{{ t.code }}</td>
          <td>{{ t.date | date: 'yyyy-MM-dd' }}</td>
          <td>{{ t.dealerName }}</td>
          <td>{{ t.stockName }}</td>
          <td *ngIf="typeId === TransactionTypeId.Transfer">{{ t.toStockName }}</td>
          <td>{{ t.total | number: '1.2-2' }}</td>
          <td>
            <span *ngIf="t.status === Status.Cancel" class="badge badge-warning">Cancelled</span>
            <span *ngIf="t.status !== Status.Cancel" class="badge badge-success">Active</span>
          </td>
          <td class="text-right text-nowrap">
            <a *ngIf="canEdit(t)" [routerLink]="[t.id, 'edit']" class="mr-2" title="Edit">
              <i class="bi bi-pencil-square text-success"></i>
            </a>
            <a *ngIf="canCancel(t)" href="javascript:void(0)" class="mr-2" title="Cancel" (click)="cancel(t)">
              <i class="bi bi-x-circle text-warning"></i>
            </a>
            <a *ngIf="canRedo(t)" href="javascript:void(0)" class="mr-2" title="Redo" (click)="redo(t)">
              <i class="bi bi-arrow-counterclockwise text-info"></i>
            </a>
            <a *ngIf="canEdit(t)" href="javascript:void(0)" title="Delete" (click)="onDelete(t)">
              <i class="bi bi-trash text-danger"></i>
            </a>
          </td>
        </tr>
      </tbody>
    </table>

    <ng-template #emptyState>
      <p class="text-center text-muted p-4 mb-0">{{ loading() ? 'Loading...' : 'No transactions found.' }}</p>
    </ng-template>
  </div>
</div>

<div class="mt-3">
  <app-pagination [page]="page()" [pageCount]="pageCount()" (pageChange)="onPageChange($event)"></app-pagination>
</div>
