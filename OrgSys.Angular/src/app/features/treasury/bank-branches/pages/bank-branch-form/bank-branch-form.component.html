<app-page-header
  [title]="id() ? 'Edit Bank Branch' : 'New Bank Branch'"
  [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Bank Branches', route: '/treasury/bank-branches' }, { label: id() ? 'Edit' : 'New' }]"
></app-page-header>

<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-end mb-3">
      <a routerLink="/treasury/bank-branches" class="btn btn-primary">
        <i class="bi bi-arrow-return-left"></i> Back
      </a>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row">
        <div class="form-group col-12 col-md-6">
          <label>Name</label>
          <input type="text" class="form-control" formControlName="name" placeholder="Name" />
          <div class="text-danger mt-1" *ngIf="form.controls.name.touched && form.controls.name.invalid">
            Name is required (3-150 characters).
          </div>
        </div>

        <div class="form-group col-12 col-md-6">
          <label>Bank</label>
          <select class="form-control" formControlName="bankId">
            <option [ngValue]="0" disabled>Select a bank</option>
            <option *ngFor="let bank of banks()" [ngValue]="bank.id">{{ bank.name }}</option>
          </select>
          <div class="text-danger mt-1" *ngIf="form.controls.bankId.touched && form.controls.bankId.invalid">
            A bank is required.
          </div>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Country</label>
          <select class="form-control" formControlName="countryId">
            <option [ngValue]="0" disabled>Select a country</option>
            <option *ngFor="let country of countries()" [ngValue]="country.id">{{ country.name }}</option>
          </select>
          <div class="text-danger mt-1" *ngIf="form.controls.countryId.touched && form.controls.countryId.invalid">
            Country is required.
          </div>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>City</label>
          <select class="form-control" formControlName="cityId" [disabled]="!form.controls.countryId.value">
            <option [ngValue]="0" disabled>{{ loadingCities() ? 'Loading...' : 'Select a city' }}</option>
            <option *ngFor="let city of cities()" [ngValue]="city.id">{{ city.name }}</option>
          </select>
          <div class="text-danger mt-1" *ngIf="form.controls.cityId.touched && form.controls.cityId.invalid">
            City is required.
          </div>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>District</label>
          <select class="form-control" formControlName="districtId" [disabled]="!form.controls.cityId.value">
            <option [ngValue]="0" disabled>{{ loadingDistricts() ? 'Loading...' : 'Select a district' }}</option>
            <option *ngFor="let district of districts()" [ngValue]="district.id">{{ district.name }}</option>
          </select>
          <div class="text-danger mt-1" *ngIf="form.controls.districtId.touched && form.controls.districtId.invalid">
            District is required.
          </div>
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
