<app-page-header
  [title]="'New ' + (financialType()?.name ?? 'Transaction')"
  [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Financial' }, { label: financialType()?.name ?? '', route: '/financial/transactions/' + financialTypeId }, { label: 'New' }]"
></app-page-header>

<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-end mb-3">
      <a [routerLink]="['/financial/transactions', financialTypeId]" class="btn btn-primary">
        <i class="bi bi-arrow-return-left"></i> Back
      </a>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row">
        <div class="form-group col-12 col-md-4">
          <label>Bank / cash box</label>
          <select class="form-control" formControlName="financialAccountId">
            <option [ngValue]="0" disabled>Select an account</option>
            <option *ngFor="let fa of financialAccounts()" [ngValue]="fa.id">{{ fa.code }} {{ fa.name }}</option>
          </select>
          <div class="text-danger mt-1" *ngIf="form.controls.financialAccountId.touched && form.controls.financialAccountId.invalid">
            An account is required.
          </div>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Direction</label>
          <select class="form-control" formControlName="direction">
            <option [ngValue]="FinancialTransactionDirection.In">In</option>
            <option [ngValue]="FinancialTransactionDirection.Out">Out</option>
          </select>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Date</label>
          <input type="date" class="form-control" formControlName="transactionDate" />
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Amount</label>
          <input type="number" step="0.01" class="form-control" formControlName="amount" />
          <div class="text-danger mt-1" *ngIf="form.controls.amount.touched && form.controls.amount.invalid">
            Amount must be greater than zero.
          </div>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Currency</label>
          <select class="form-control" formControlName="currencyId" (change)="onCurrencyChange(form.controls.currencyId.value)">
            <option [ngValue]="0" disabled>Select a currency</option>
            <option *ngFor="let currency of currencies()" [ngValue]="currency.id">{{ currency.name }}</option>
          </select>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Exchange rate</label>
          <input type="number" step="0.0001" class="form-control" formControlName="exchangeRate" />
        </div>

        <ng-container *ngIf="showsReference">
          <div class="form-group col-12 col-md-4">
            <label>Reference type</label>
            <select class="form-control" formControlName="referenceType" (change)="onReferenceTypeChange()">
              <option [ngValue]="FinancialReferenceType.Other">Other</option>
              <option [ngValue]="FinancialReferenceType.Customer">Customer</option>
              <option [ngValue]="FinancialReferenceType.Supplier">Supplier</option>
              <option [ngValue]="FinancialReferenceType.Expense">Expense account</option>
              <option [ngValue]="FinancialReferenceType.Income">Income account</option>
            </select>
          </div>

          <div class="form-group col-12 col-md-4" *ngIf="form.controls.referenceType.value !== FinancialReferenceType.Other">
            <label>Reference</label>
            <select class="form-control" formControlName="referenceId">
              <option [ngValue]="0" disabled>Select a reference</option>
              <option *ngFor="let opt of referenceOptions()" [ngValue]="opt.id">{{ opt.label }}</option>
            </select>
          </div>
        </ng-container>

        <div class="form-group col-12 col-md-4" *ngIf="referenceNeedsCounterAccount()">
          <label>Counter account</label>
          <select class="form-control" formControlName="counterAccountId">
            <option [ngValue]="0" disabled>Select a counter account</option>
            <option *ngFor="let account of glAccounts()" [ngValue]="account.id">{{ account.code }} {{ account.name }}</option>
          </select>
        </div>

        <div class="form-group col-12">
          <label>Description</label>
          <input type="text" class="form-control" formControlName="description" placeholder="Description" />
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Posting...' : 'Post' }}
        </button>
      </div>
    </form>
  </div>
</div>
