<app-page-header
  [title]="(id() ? 'Edit ' : 'New ') + title.slice(0, -1)"
  [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: title, route: basePath }, { label: id() ? 'Edit' : 'New' }]"
></app-page-header>

<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-end mb-3">
      <a [routerLink]="basePath" class="btn btn-primary">
        <i class="bi bi-arrow-return-left"></i> Back
      </a>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row">
        <div class="form-group col-12 col-md-6">
          <label>Name</label>
          <input type="text" class="form-control" formControlName="name" placeholder="Name" />
          <div class="text-danger mt-1" *ngIf="form.controls.name.touched && form.controls.name.invalid">
            Name is required (3-100 characters).
          </div>
        </div>

        <div class="form-group col-12 col-md-6">
          <label>GL account</label>
          <select class="form-control" formControlName="accountId">
            <option [ngValue]="0" disabled>Select a GL account</option>
            <option *ngFor="let account of glAccounts()" [ngValue]="account.id">{{ account.code }} {{ account.name }}</option>
          </select>
          <div class="text-danger mt-1" *ngIf="form.controls.accountId.touched && form.controls.accountId.invalid">
            A postable GL account is required.
          </div>
        </div>

        <div class="form-group col-12 col-md-6">
          <label>Currency</label>
          <select class="form-control" formControlName="currencyId">
            <option [ngValue]="0">(none)</option>
            <option *ngFor="let currency of currencies()" [ngValue]="currency.id">{{ currency.name }}</option>
          </select>
        </div>

        <div class="form-group col-12 col-md-6 d-flex align-items-end">
          <label class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" formControlName="isActive" id="isActive" />
            <label class="custom-control-label" for="isActive">Active</label>
          </label>
        </div>

        <ng-container *ngIf="!isBank">
          <div class="form-group col-12 col-md-6">
            <label>Branch</label>
            <select class="form-control" formControlName="branchId">
              <option [ngValue]="0">(none)</option>
              <option *ngFor="let branch of branches()" [ngValue]="branch.id">{{ branch.name }}</option>
            </select>
          </div>
        </ng-container>

        <ng-container *ngIf="isBank">
          <div class="form-group col-12 col-md-6">
            <label>Bank</label>
            <select class="form-control" formControlName="bankId">
              <option [ngValue]="0">Select a bank</option>
              <option *ngFor="let bank of banks()" [ngValue]="bank.id">{{ bank.name }}</option>
            </select>
          </div>

          <div class="form-group col-12 col-md-6">
            <label>Bank branch</label>
            <select class="form-control" formControlName="bankBranchId">
              <option [ngValue]="0">(none)</option>
              <option *ngFor="let branch of branchesForSelectedBank()" [ngValue]="branch.id">{{ branch.name }}</option>
            </select>
          </div>

          <div class="form-group col-12 col-md-4">
            <label>Account number</label>
            <input type="text" class="form-control" formControlName="accountNumber" />
          </div>

          <div class="form-group col-12 col-md-4">
            <label>IBAN</label>
            <input type="text" class="form-control" formControlName="iban" />
          </div>

          <div class="form-group col-12 col-md-4">
            <label>SWIFT code</label>
            <input type="text" class="form-control" formControlName="swiftCode" />
          </div>
        </ng-container>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
