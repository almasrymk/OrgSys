<app-page-header
  title="New Transfer"
  [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Financial' }, { label: 'Transfers', route: '/treasury/transfers' }, { label: 'New' }]"
></app-page-header>

<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-end mb-3">
      <a routerLink="/treasury/transfers" class="btn btn-primary">
        <i class="bi bi-arrow-return-left"></i> Back
      </a>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row">
        <div class="form-group col-12 col-md-6">
          <label>From (source)</label>
          <select class="form-control" formControlName="fromFinancialAccountId">
            <option [ngValue]="0" disabled>Select a source account</option>
            <option *ngFor="let fa of financialAccounts()" [ngValue]="fa.id">{{ fa.code }} {{ fa.name }}</option>
          </select>
          <div class="text-danger mt-1" *ngIf="form.controls.fromFinancialAccountId.touched && form.controls.fromFinancialAccountId.invalid">
            A source account is required.
          </div>
        </div>

        <div class="form-group col-12 col-md-6">
          <label>To (destination)</label>
          <select class="form-control" formControlName="toFinancialAccountId">
            <option [ngValue]="0" disabled>Select a destination account</option>
            <option *ngFor="let fa of financialAccounts()" [ngValue]="fa.id">{{ fa.code }} {{ fa.name }}</option>
          </select>
          <div class="text-danger mt-1" *ngIf="form.controls.toFinancialAccountId.touched && form.controls.toFinancialAccountId.invalid">
            A destination account is required.
          </div>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Amount</label>
          <input type="number" step="0.01" class="form-control" formControlName="amount" />
          <div class="text-danger mt-1" *ngIf="form.controls.amount.touched && form.controls.amount.invalid">
            Amount must be greater than zero.
          </div>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Currency</label>
          <select class="form-control" formControlName="currencyId" (change)="onCurrencyChange(form.controls.currencyId.value)">
            <option [ngValue]="0" disabled>Select a currency</option>
            <option *ngFor="let currency of currencies()" [ngValue]="currency.id">{{ currency.name }}</option>
          </select>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Exchange rate</label>
          <input type="number" step="0.0001" class="form-control" formControlName="exchangeRate" />
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Date</label>
          <input type="date" class="form-control" formControlName="transactionDate" />
        </div>

        <div class="form-group col-12">
          <label>Description</label>
          <input type="text" class="form-control" formControlName="description" placeholder="Description" />
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Posting...' : 'Post' }}
        </button>
      </div>
    </form>
  </div>
</div>
