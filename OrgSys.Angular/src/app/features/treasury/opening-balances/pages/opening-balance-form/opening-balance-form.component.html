<app-page-header
  [title]="id() ? 'Edit Opening Balance' : 'New Opening Balance'"
  [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Opening Balances', route: '/financial/opening-balances' }, { label: id() ? 'Edit' : 'New' }]"
></app-page-header>

<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-end mb-3">
      <a routerLink="/financial/opening-balances" class="btn btn-primary">
        <i class="bi bi-arrow-return-left"></i> Back
      </a>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row">
        <div class="form-group col-12 col-md-6">
          <label>Financial account</label>
          <select class="form-control" formControlName="financialAccountId">
            <option [ngValue]="0" disabled>Select a cash box or bank account</option>
            <option *ngFor="let fa of financialAccounts()" [ngValue]="fa.id">{{ fa.code }} {{ fa.name }}</option>
          </select>
          <div class="text-danger mt-1" *ngIf="form.controls.financialAccountId.touched && form.controls.financialAccountId.invalid">
            A financial account is required.
          </div>
        </div>

        <div class="form-group col-12 col-md-6">
          <label>Date</label>
          <input type="date" class="form-control" formControlName="date" />
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Amount</label>
          <input type="number" step="0.01" class="form-control" formControlName="amount" />
          <div class="text-danger mt-1" *ngIf="form.controls.amount.touched && form.controls.amount.invalid">
            Amount must be greater than zero.
          </div>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Currency</label>
          <select class="form-control" formControlName="currencyId" (change)="onCurrencyChange(form.controls.currencyId.value)">
            <option [ngValue]="0" disabled>Select a currency</option>
            <option *ngFor="let currency of currencies()" [ngValue]="currency.id">{{ currency.name }}</option>
          </select>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Exchange rate</label>
          <input type="number" step="0.0001" class="form-control" formControlName="rate" />
        </div>

        <div class="form-group col-12">
          <label>Notes</label>
          <input type="text" class="form-control" formControlName="notes" placeholder="Notes" />
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save as Draft' }}
        </button>
      </div>
    </form>
  </div>
</div>
