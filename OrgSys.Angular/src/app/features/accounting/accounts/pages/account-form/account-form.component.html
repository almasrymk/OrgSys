<app-page-header
  [title]="id() ? 'Edit Account' : 'New Account'"
  [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Chart of Accounts', route: '/accounting/accounts' }, { label: id() ? 'Edit' : 'New' }]"
></app-page-header>

<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-end mb-3">
      <a routerLink="/accounting/accounts" class="btn btn-primary">
        <i class="bi bi-arrow-return-left"></i> Back
      </a>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row">
        <div class="form-group col-12 col-md-6">
          <label>Account type</label>
          <select class="form-control" formControlName="accountTypeId">
            <option [ngValue]="0" disabled>Select an account type</option>
            <option *ngFor="let type of accountTypes()" [ngValue]="type.id">{{ type.name }}</option>
          </select>
          <div class="text-danger mt-1" *ngIf="form.controls.accountTypeId.touched && form.controls.accountTypeId.invalid">
            Account type is required.
          </div>
        </div>

        <div class="form-group col-12 col-md-6">
          <label>Code</label>
          <input type="text" class="form-control" formControlName="code" placeholder="Code" />
          <div class="text-danger mt-1" *ngIf="form.controls.code.touched && form.controls.code.invalid">
            Code is required.
          </div>
        </div>

        <div class="form-group col-12 col-md-6">
          <label>Name</label>
          <input type="text" class="form-control" formControlName="name" placeholder="Name" />
          <div class="text-danger mt-1" *ngIf="form.controls.name.touched && form.controls.name.invalid">
            Name is required (3-150 characters).
          </div>
        </div>

        <div class="form-group col-12 col-md-6">
          <label>Parent account</label>
          <select class="form-control" formControlName="parentId">
            <option [ngValue]="0">(none — root account)</option>
            <option *ngFor="let opt of parentOptions()" [ngValue]="opt.id">{{ opt.label }}</option>
          </select>
        </div>

        <div class="form-group col-6 col-md-3">
          <label>Debit</label>
          <input type="number" step="0.01" class="form-control" formControlName="debit" />
        </div>

        <div class="form-group col-6 col-md-3">
          <label>Credit</label>
          <input type="number" step="0.01" class="form-control" formControlName="credit" />
        </div>

        <div class="form-group col-12 col-md-6 d-flex align-items-end">
          <label class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" formControlName="isPostable" id="isPostable" />
            <label class="custom-control-label" for="isPostable">Postable (journal entries can target it directly)</label>
          </label>
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
