<app-page-header title="Journal Entries" [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Accounting' }, { label: 'Journal Entries' }]">
  <div class="d-flex justify-content-between align-items-center flex-wrap">
    <a *appHasPermission="'Journal.Add'" routerLink="new" class="btn btn-outline-primary">
      <i class="bi bi-plus-lg"></i> Add
    </a>

    <div class="search-text" style="max-width: 260px;">
      <input
        type="text"
        class="form-control"
        placeholder="Search..."
        [ngModel]="keySearch()"
        (ngModelChange)="keySearch.set($event)"
        (keyup.enter)="onSearch()"
      />
    </div>
  </div>
</app-page-header>

<div class="card">
  <div class="card-body p-0">
    <table class="table table-hover m-0" *ngIf="journals().length; else emptyState">
      <thead>
        <tr>
          <th>Code</th>
          <th>Date</th>
          <th>Type</th>
          <th>Note</th>
          <th>Status</th>
          <th style="width: 220px;"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let journal of journals()" [class.text-muted]="journal.status === Status.Cancel">
          <td>{{ journal.code }}</td>
          <td>{{ journal.date | date: 'yyyy-MM-dd' }}</td>
          <td>{{ journal.journalTypeName }}</td>
          <td>{{ journal.note }}</td>
          <td>
            <span class="badge" [ngClass]="statusBadgeClass(journal)">{{ statusLabel(journal) }}</span>
          </td>
          <td class="text-right text-nowrap">
            <a *ngIf="canEdit(journal)" [routerLink]="[journal.id, 'edit']" class="mr-2" title="Edit">
              <i class="bi bi-pencil-square text-success"></i>
            </a>
            <a *ngIf="canPost(journal)" href="javascript:void(0)" class="mr-2" title="Post" (click)="post(journal)">
              <i class="bi bi-check2-circle text-primary"></i>
            </a>
            <a *ngIf="canCancel(journal)" href="javascript:void(0)" class="mr-2" title="Cancel" (click)="cancel(journal)">
              <i class="bi bi-x-circle text-warning"></i>
            </a>
            <a *ngIf="canRedo(journal)" href="javascript:void(0)" class="mr-2" title="Redo" (click)="redo(journal)">
              <i class="bi bi-arrow-counterclockwise text-info"></i>
            </a>
            <a *ngIf="canReverse(journal)" href="javascript:void(0)" class="mr-2" title="Reverse" (click)="reverse(journal)">
              <i class="bi bi-arrow-repeat text-danger"></i>
            </a>
            <a *ngIf="canDelete(journal)" href="javascript:void(0)" title="Delete" (click)="onDelete(journal)">
              <i class="bi bi-trash text-danger"></i>
            </a>
          </td>
        </tr>
      </tbody>
    </table>

    <ng-template #emptyState>
      <p class="text-center text-muted p-4 mb-0">{{ loading() ? 'Loading...' : 'No journal entries found.' }}</p>
    </ng-template>
  </div>
</div>

<div class="mt-3">
  <app-pagination [page]="page()" [pageCount]="pageCount()" (pageChange)="onPageChange($event)"></app-pagination>
</div>
