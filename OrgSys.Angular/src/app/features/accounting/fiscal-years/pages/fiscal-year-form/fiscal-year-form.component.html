<app-page-header
  [title]="id() ? 'Edit Fiscal Year' : 'New Fiscal Year'"
  [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Fiscal Years', route: '/administration/fiscal-years' }, { label: id() ? 'Edit' : 'New' }]"
></app-page-header>

<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-end mb-3">
      <a routerLink="/administration/fiscal-years" class="btn btn-primary">
        <i class="bi bi-arrow-return-left"></i> Back
      </a>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row">
        <div class="form-group col-12 col-md-4">
          <label>Name</label>
          <input type="text" class="form-control" formControlName="name" placeholder="Name" />
          <div class="text-danger mt-1" *ngIf="form.controls.name.touched && form.controls.name.invalid">
            Name is required (3-150 characters).
          </div>
        </div>

        <div class="form-group col-6 col-md-4">
          <label>Start date</label>
          <input type="date" class="form-control" formControlName="startDate" />
        </div>

        <div class="form-group col-6 col-md-4">
          <label>End date</label>
          <input type="date" class="form-control" formControlName="endDate" />
          <div class="text-danger mt-1" *ngIf="form.errors?.['dateRange']">
            End date must be after the start date.
          </div>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Status</label>
          <select class="form-control" formControlName="fiscalYearStatus">
            <option [ngValue]="FiscalYearStatus.Open">Open</option>
            <option [ngValue]="FiscalYearStatus.Closed">Closed</option>
          </select>
        </div>

        <div class="form-group col-12 col-md-4 d-flex align-items-end">
          <label class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" formControlName="isCurrent" id="isCurrent" />
            <label class="custom-control-label" for="isCurrent">Current fiscal year</label>
          </label>
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
