<app-page-header
  [title]="(id() ? 'Edit ' : 'New ') + title.slice(0, -1)"
  [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: title, route: basePath }, { label: id() ? 'Edit' : 'New' }]"
></app-page-header>

<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-end mb-3">
      <a [routerLink]="basePath" class="btn btn-primary">
        <i class="bi bi-arrow-return-left"></i> Back
      </a>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row">
        <div class="form-group col-12 col-md-6">
          <label>Name</label>
          <input type="text" class="form-control" formControlName="name" placeholder="Name" />
          <div class="text-danger mt-1" *ngIf="form.controls.name.touched && form.controls.name.invalid">
            Name is required (3-150 characters).
          </div>
        </div>

        <div class="form-group col-12 col-md-6">
          <label>Group</label>
          <select class="form-control" formControlName="dealerGroupId">
            <option [ngValue]="0" disabled>Select a group</option>
            <option *ngFor="let group of dealerGroups()" [ngValue]="group.id">{{ group.name }}</option>
          </select>
          <div class="text-danger mt-1" *ngIf="form.controls.dealerGroupId.touched && form.controls.dealerGroupId.invalid">
            A group is required.
          </div>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Phone</label>
          <input type="text" class="form-control" formControlName="phone" placeholder="Phone" />
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Email</label>
          <input type="email" class="form-control" formControlName="email" placeholder="Email" />
          <div class="text-danger mt-1" *ngIf="form.controls.email.touched && form.controls.email.invalid">
            Enter a valid email address.
          </div>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>GL account</label>
          <select class="form-control" formControlName="accountId">
            <option [ngValue]="0" disabled>Select a GL account</option>
            <option *ngFor="let account of glAccounts()" [ngValue]="account.id">{{ account.code }} {{ account.name }}</option>
          </select>
          <div class="text-danger mt-1" *ngIf="form.controls.accountId.touched && form.controls.accountId.invalid">
            A linked GL account is required.
          </div>
        </div>

        <div class="form-group col-12">
          <label>Address</label>
          <input type="text" class="form-control" formControlName="address" placeholder="Address" />
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Country</label>
          <select class="form-control" formControlName="countryId">
            <option [ngValue]="0">(none)</option>
            <option *ngFor="let country of countries()" [ngValue]="country.id">{{ country.name }}</option>
          </select>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>City</label>
          <select class="form-control" formControlName="cityId" [disabled]="!form.controls.countryId.value">
            <option [ngValue]="0">{{ loadingCities() ? 'Loading...' : '(none)' }}</option>
            <option *ngFor="let city of cities()" [ngValue]="city.id">{{ city.name }}</option>
          </select>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>District</label>
          <select class="form-control" formControlName="districtId" [disabled]="!form.controls.cityId.value">
            <option [ngValue]="0">{{ loadingDistricts() ? 'Loading...' : '(none)' }}</option>
            <option *ngFor="let district of districts()" [ngValue]="district.id">{{ district.name }}</option>
          </select>
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
