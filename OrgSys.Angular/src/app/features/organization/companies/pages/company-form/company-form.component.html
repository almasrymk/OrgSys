<app-page-header
  [title]="id() ? 'Edit Company' : 'New Company'"
  [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Companies', route: '/organization/companies' }, { label: id() ? 'Edit' : 'New' }]"
></app-page-header>

<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-end mb-3">
      <a routerLink="/organization/companies" class="btn btn-primary">
        <i class="bi bi-arrow-return-left"></i> Back
      </a>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row">
        <div class="form-group col-12 col-md-6">
          <label>Legal name</label>
          <input type="text" class="form-control" formControlName="legalName" />
          <div class="text-danger mt-1" *ngIf="form.controls.legalName.touched && form.controls.legalName.invalid">
            Legal name is required (3-150 characters).
          </div>
        </div>
        <div class="form-group col-12 col-md-6">
          <label>Trade name</label>
          <input type="text" class="form-control" formControlName="tradeName" />
        </div>
        <div class="form-group col-12 col-md-6">
          <label>Tax registration number</label>
          <input type="text" class="form-control" formControlName="taxRegistrationNumber" />
        </div>
        <div class="form-group col-12 col-md-6">
          <label>Commercial registration number</label>
          <input type="text" class="form-control" formControlName="commercialRegistrationNumber" />
        </div>
        <div class="form-group col-12 col-md-4">
          <label>Default currency</label>
          <select class="form-control" formControlName="defaultCurrencyId">
            <option [ngValue]="0">(none)</option>
            <option *ngFor="let currency of currencies()" [ngValue]="currency.id">{{ currency.name }}</option>
          </select>
        </div>
        <div class="form-group col-12 col-md-4">
          <label>Country</label>
          <select class="form-control" formControlName="countryId">
            <option [ngValue]="0">(none)</option>
            <option *ngFor="let country of countries()" [ngValue]="country.id">{{ country.name }}</option>
          </select>
        </div>
        <div class="form-group col-12 col-md-4">
          <label>Phone</label>
          <input type="text" class="form-control" formControlName="phone" />
        </div>
        <div class="form-group col-12 col-md-6">
          <label>Email</label>
          <input type="email" class="form-control" formControlName="email" />
        </div>
        <div class="form-group col-12 col-md-6">
          <label>Website</label>
          <input type="text" class="form-control" formControlName="website" />
        </div>
        <div class="form-group col-12">
          <label>Address</label>
          <input type="text" class="form-control" formControlName="address" />
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
