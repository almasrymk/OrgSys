<app-page-header title="New Inventory Receipt" [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Inventory' }, { label: 'Receipts', route: '/inventory/receipts' }, { label: 'New' }]"></app-page-header>

<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="card mb-3">
    <div class="card-body">
      <div class="row">
        <div class="form-group col-12 col-md-3">
          <label>Date</label>
          <input type="date" class="form-control" formControlName="date" />
        </div>
        <div class="form-group col-12 col-md-4">
          <label>Warehouse</label>
          <select class="form-control" formControlName="stockId">
            <option [ngValue]="0" disabled>Select a warehouse</option>
            <option *ngFor="let stock of stocks()" [ngValue]="stock.id">{{ stock.name }}</option>
          </select>
        </div>
        <div class="form-group col-12 col-md-5">
          <label>Supplier / Dealer (optional)</label>
          <select class="form-control" formControlName="dealerId">
            <option [ngValue]="0">None</option>
            <option *ngFor="let dealer of dealers()" [ngValue]="dealer.id">{{ dealer.name }}</option>
          </select>
        </div>
        <div class="form-group col-12 col-md-4">
          <label>Purchase order Id (optional)</label>
          <input type="number" class="form-control" formControlName="purchaseOrderId" min="0" step="1" />
        </div>
        <div class="form-group col-12">
          <label>Notes</label>
          <textarea class="form-control" rows="2" formControlName="notes"></textarea>
        </div>
      </div>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-body p-0">
      <table class="table m-0" formArrayName="lines">
        <thead>
          <tr>
            <th>Product</th>
            <th style="width: 140px;">Unit</th>
            <th style="width: 120px;">Quantity</th>
            <th style="width: 140px;">Unit Cost</th>
            <th style="width: 120px;" class="text-right">Total</th>
            <th style="width: 40px;"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let line of lines.controls; let i = index" [formGroupName]="i">
            <td>
              <select class="form-control" formControlName="productId" (change)="onProductChange(i, line.value.productId!)">
                <option [ngValue]="0" disabled>Select a product</option>
                <option *ngFor="let product of products()" [ngValue]="product.id">{{ product.code }} {{ product.name }}</option>
              </select>
            </td>
            <td>
              <select class="form-control" formControlName="unitId">
                <option [ngValue]="0" disabled>Unit</option>
                <option *ngFor="let unit of units()" [ngValue]="unit.id">{{ unit.name }}</option>
              </select>
            </td>
            <td>
              <input type="number" class="form-control" formControlName="quantity" min="0.001" step="0.001" (input)="recomputeLine()" />
            </td>
            <td>
              <input type="number" class="form-control" formControlName="unitCost" min="0" step="0.0001" (input)="recomputeLine()" />
            </td>
            <td class="text-right align-middle">
              {{ (line.getRawValue().quantity * line.getRawValue().unitCost) | number: '1.2-2' }}
            </td>
            <td class="align-middle text-center">
              <a href="javascript:void(0)" title="Remove" (click)="removeLine(i)">
                <i class="bi bi-trash text-danger"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer d-flex justify-content-between align-items-center">
      <button type="button" class="btn btn-outline-primary btn-sm" (click)="addLine()">
        <i class="bi bi-plus-lg"></i> Add line
      </button>
      <strong>Total: {{ linesTotal() | number: '1.2-2' }}</strong>
    </div>
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="saving()">
    <span *ngIf="saving()" class="spinner-border spinner-border-sm mr-1"></span> Save as Draft
  </button>
  <a routerLink="/inventory/receipts" class="btn btn-outline-secondary ml-2">Cancel</a>
</form>
