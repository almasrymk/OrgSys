<app-page-header title="New Warehouse Location" [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Warehouse' }, { label: 'Locations', route: '/warehouse/locations' }, { label: 'New' }]"></app-page-header>

<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="form-group col-12 col-md-4">
        <label>Warehouse</label>
        <select class="form-control" [(ngModel)]="model.stockId">
          <option [ngValue]="0" disabled>Select a warehouse</option>
          <option *ngFor="let stock of stocks()" [ngValue]="stock.id">{{ stock.name }}</option>
        </select>
      </div>
      <div class="form-group col-12 col-md-4">
        <label>Code</label>
        <input type="text" class="form-control" [(ngModel)]="model.code" maxlength="50" />
      </div>
      <div class="form-group col-12 col-md-4">
        <label>Name</label>
        <input type="text" class="form-control" [ngModel]="model.name ?? ''" (ngModelChange)="model.name = $event" />
      </div>
      <div class="form-group col-12 col-md-4">
        <label>Type</label>
        <input type="text" class="form-control" placeholder="Zone / Aisle / Rack / Bin" [ngModel]="model.locationType ?? ''" (ngModelChange)="model.locationType = $event" />
      </div>
      <div class="form-group col-6 col-md-4">
        <div class="custom-control custom-checkbox">
          <input type="checkbox" class="custom-control-input" id="isReceivable" [(ngModel)]="model.isReceivable" />
          <label class="custom-control-label" for="isReceivable">Receivable</label>
        </div>
      </div>
      <div class="form-group col-6 col-md-4">
        <div class="custom-control custom-checkbox">
          <input type="checkbox" class="custom-control-input" id="isPickable" [(ngModel)]="model.isPickable" />
          <label class="custom-control-label" for="isPickable">Pickable</label>
        </div>
      </div>
    </div>

    <div class="mt-3">
      <button type="button" class="btn btn-primary" [disabled]="saving()" (click)="save()">
        <span *ngIf="saving()" class="spinner-border spinner-border-sm mr-1"></span> Save
      </button>
      <a routerLink="/warehouse/locations" class="btn btn-outline-secondary ml-2">Cancel</a>
    </div>
  </div>
</div>
