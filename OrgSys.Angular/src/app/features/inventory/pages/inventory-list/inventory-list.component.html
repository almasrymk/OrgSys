<app-page-header title="Inventory Counts" [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Inventory Counts' }]">
  <div class="d-flex justify-content-between align-items-center flex-wrap">
    <a *appHasPermission="'Inventory.Add,Inventory.All'" [routerLink]="['new']" class="btn btn-outline-primary">
      <i class="bi bi-plus-lg"></i> Add
    </a>

    <div class="search-text" style="max-width: 260px;">
      <input
        type="text"
        class="form-control"
        placeholder="Search..."
        [ngModel]="keySearch()"
        (ngModelChange)="keySearch.set($event)"
        (keyup.enter)="onSearch()"
      />
    </div>
  </div>
</app-page-header>

<div class="card">
  <div class="card-body p-0">
    <table class="table table-hover m-0" *ngIf="inventories().length; else emptyState">
      <thead>
        <tr>
          <th>Code</th>
          <th>Date</th>
          <th>Warehouse</th>
          <th>Adjustment</th>
          <th>Status</th>
          <th style="width: 160px;"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let inv of inventories()" [class.text-muted]="inv.status === Status.Cancel">
          <td>{{ inv.code }}</td>
          <td>{{ inv.date | date: 'yyyy-MM-dd' }}</td>
          <td>{{ inv.stockName }}</td>
          <td>
            <span *ngIf="inv.hasAdjustment" class="badge badge-success">Created</span>
            <span *ngIf="!inv.hasAdjustment" class="badge badge-secondary">Not created</span>
          </td>
          <td>
            <span *ngIf="inv.status === Status.Cancel" class="badge badge-warning">Cancelled</span>
            <span *ngIf="inv.status !== Status.Cancel" class="badge badge-success">Active</span>
          </td>
          <td class="text-right text-nowrap">
            <a *ngIf="canEdit(inv)" [routerLink]="[inv.id, 'edit']" class="mr-2" title="Edit">
              <i class="bi bi-pencil-square text-success"></i>
            </a>
            <a
              *ngIf="!inv.hasAdjustment && canEdit(inv) && permissionService.can('Inventory.Edit,Inventory.All')"
              href="javascript:void(0)"
              class="mr-2"
              title="Create adjustment"
              (click)="createAdjustment(inv)"
            >
              <i class="bi bi-arrow-repeat text-primary"></i>
            </a>
            <a *ngIf="canCancel(inv)" href="javascript:void(0)" class="mr-2" title="Cancel" (click)="cancel(inv)">
              <i class="bi bi-x-circle text-warning"></i>
            </a>
            <a *ngIf="canRedo(inv)" href="javascript:void(0)" class="mr-2" title="Redo" (click)="redo(inv)">
              <i class="bi bi-arrow-counterclockwise text-info"></i>
            </a>
            <a *ngIf="canEdit(inv)" href="javascript:void(0)" title="Delete" (click)="onDelete(inv)">
              <i class="bi bi-trash text-danger"></i>
            </a>
          </td>
        </tr>
      </tbody>
    </table>

    <ng-template #emptyState>
      <p class="text-center text-muted p-4 mb-0">{{ loading() ? 'Loading...' : 'No inventory counts found.' }}</p>
    </ng-template>
  </div>
</div>

<div class="mt-3">
  <app-pagination [page]="page()" [pageCount]="pageCount()" (pageChange)="onPageChange($event)"></app-pagination>
</div>
