<app-page-header
  [title]="id() ? 'Edit User' : 'New User'"
  [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Users', route: '/administration/users' }, { label: id() ? 'Edit' : 'New' }]"
></app-page-header>

<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-end mb-3">
      <a routerLink="/administration/users" class="btn btn-primary">
        <i class="bi bi-arrow-return-left"></i> Back
      </a>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row">
        <div class="form-group col-12 col-md-6">
          <label>Name</label>
          <input type="text" class="form-control" formControlName="name" />
        </div>
        <div class="form-group col-12 col-md-6">
          <label>Username</label>
          <input type="text" class="form-control" formControlName="userName" />
        </div>
        <div class="form-group col-12 col-md-6">
          <label>{{ id() ? 'New password (optional)' : 'Password' }}</label>
          <input type="password" class="form-control" formControlName="password" autocomplete="new-password" />
        </div>
        <div class="form-group col-12 col-md-6">
          <label>Role</label>
          <select class="form-control" formControlName="roleId">
            <option [ngValue]="0" disabled>Select a role</option>
            <option *ngFor="let role of roles()" [ngValue]="role.id">{{ role.name }}</option>
          </select>
        </div>
        <div class="form-group col-12 col-md-6">
          <label>Branch</label>
          <select class="form-control" formControlName="branchId">
            <option [ngValue]="0">(all)</option>
            <option *ngFor="let branch of branches()" [ngValue]="branch.id">{{ branch.name }}</option>
          </select>
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
