<app-page-header title="Products" [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Settings' }, { label: 'Products' }]">
  <div class="d-flex justify-content-between align-items-center flex-wrap">
    <a *appHasPermission="'Products.Add'" routerLink="new" class="btn btn-outline-primary">
      <i class="bi bi-plus-lg"></i> Add
    </a>

    <div class="search-text" style="max-width: 260px;">
      <input
        type="text"
        class="form-control"
        placeholder="Search..."
        [ngModel]="keySearch()"
        (ngModelChange)="keySearch.set($event)"
        (keyup.enter)="onSearch()"
      />
    </div>
  </div>
</app-page-header>

<div class="card">
  <div class="card-body p-0">
    <table class="table table-hover m-0" *ngIf="products().length; else emptyState">
      <thead>
        <tr>
          <th>Code</th>
          <th>Name</th>
          <th>Classification</th>
          <th class="text-right">Price</th>
          <th class="text-right">Cost</th>
          <th style="width: 120px;"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products()" [class.text-muted]="product.status === Status.Cancel">
          <td>{{ product.code }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.classificationName }}</td>
          <td class="text-right">{{ product.price | number: '1.2-2' }}</td>
          <td class="text-right">{{ product.cost | number: '1.2-2' }}</td>
          <td class="text-right">
            <a *appHasPermission="'Products.Edit'" [routerLink]="[product.id, 'edit']" class="mr-2">
              <i class="bi bi-pencil-square text-success"></i>
            </a>
            <a *appHasPermission="'Products.Delete'" href="javascript:void(0)" (click)="onDelete(product)">
              <i class="bi bi-trash text-danger"></i>
            </a>
          </td>
        </tr>
      </tbody>
    </table>

    <ng-template #emptyState>
      <p class="text-center text-muted p-4 mb-0">{{ loading() ? 'Loading...' : 'No products found.' }}</p>
    </ng-template>
  </div>
</div>

<div class="mt-3">
  <app-pagination [page]="page()" [pageCount]="pageCount()" (pageChange)="onPageChange($event)"></app-pagination>
</div>
