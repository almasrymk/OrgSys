<app-page-header
  [title]="id() ? 'Edit Role' : 'New Role'"
  [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Roles', route: '/administration/roles' }, { label: id() ? 'Edit' : 'New' }]"
></app-page-header>

<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-end mb-3">
      <a routerLink="/administration/roles" class="btn btn-primary">
        <i class="bi bi-arrow-return-left"></i> Back
      </a>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row">
        <div class="form-group col-12 col-md-6">
          <label>Name</label>
          <input type="text" class="form-control" formControlName="name" />
          <div class="text-danger mt-1" *ngIf="form.controls.name.touched && form.controls.name.invalid">
            Name is required (3-50 characters).
          </div>
        </div>
      </div>

      <h6 class="mt-3">Permissions</h6>
      <div class="row">
        <div class="col-12 col-md-4" *ngFor="let permission of permissions()">
          <label class="custom-control custom-checkbox">
            <input
              type="checkbox"
              class="custom-control-input"
              [id]="'perm-' + permission.id"
              [checked]="permission.select"
              (change)="toggle(permission, $any($event.target).checked)"
            />
            <label class="custom-control-label" [for]="'perm-' + permission.id">
              {{ permission.value || permission.key }}
            </label>
          </label>
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
