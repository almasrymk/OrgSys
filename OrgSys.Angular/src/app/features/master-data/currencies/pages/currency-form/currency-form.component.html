<app-page-header
  [title]="id() ? 'Edit Currency' : 'New Currency'"
  [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Currencies', route: '/administration/currencies' }, { label: id() ? 'Edit' : 'New' }]"
></app-page-header>

<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-end mb-3">
      <a routerLink="/administration/currencies" class="btn btn-primary">
        <i class="bi bi-arrow-return-left"></i> Back
      </a>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row">
        <div class="form-group col-12 col-md-4">
          <label>Name</label>
          <input type="text" class="form-control" formControlName="name" placeholder="Name" />
          <div class="text-danger mt-1" *ngIf="form.controls.name.touched && form.controls.name.invalid">
            Name is required (3-150 characters).
          </div>
        </div>

        <div class="form-group col-12 col-md-4">
          <label>Rate</label>
          <input type="number" step="0.01" class="form-control" formControlName="rate" placeholder="Rate" />
          <div class="text-danger mt-1" *ngIf="form.controls.rate.touched && form.controls.rate.invalid">
            Rate must be zero or greater.
          </div>
        </div>

        <div class="form-group col-12 col-md-4 d-flex align-items-end">
          <label class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" formControlName="isDefault" id="isDefault" />
            <label class="custom-control-label" for="isDefault">Default currency</label>
          </label>
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
