<app-page-header
  [title]="id() ? 'Edit Price List' : 'New Price List'"
  [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Price Lists', route: '/catalog/price-lists' }, { label: id() ? 'Edit' : 'New' }]"
></app-page-header>

<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-end mb-3">
      <a routerLink="/catalog/price-lists" class="btn btn-primary">
        <i class="bi bi-arrow-return-left"></i> Back
      </a>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row">
        <div class="form-group col-12 col-md-6">
          <label>Name</label>
          <input type="text" class="form-control" formControlName="name" placeholder="Name" />
          <div class="text-danger mt-1" *ngIf="form.controls.name.touched && form.controls.name.invalid">
            Name is required (3-150 characters).
          </div>
        </div>

        <div class="form-group col-12 col-md-6">
          <label>Currency</label>
          <select class="form-control" formControlName="currencyId">
            <option [ngValue]="0">(none)</option>
            <option *ngFor="let currency of currencies()" [ngValue]="currency.id">{{ currency.name }}</option>
          </select>
        </div>

        <div class="form-group col-12 col-md-3">
          <label>Valid from</label>
          <input type="date" class="form-control" formControlName="validFrom" />
        </div>

        <div class="form-group col-12 col-md-3">
          <label>Valid to</label>
          <input type="date" class="form-control" formControlName="validTo" />
        </div>

        <div class="form-group col-12 col-md-3 d-flex align-items-end">
          <label class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" formControlName="isDefault" id="priceListIsDefault" />
            <label class="custom-control-label" for="priceListIsDefault">Default</label>
          </label>
        </div>

        <div class="form-group col-12 col-md-3 d-flex align-items-end">
          <label class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" formControlName="isActive" id="priceListIsActive" />
            <label class="custom-control-label" for="priceListIsActive">Active</label>
          </label>
        </div>
      </div>

      <div class="mt-3">
        <h5>Entries</h5>
        <table class="table table-sm" formArrayName="entries">
          <thead>
            <tr>
              <th>Product</th>
              <th>Unit</th>
              <th>Price</th>
              <th>Min qty</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let entry of entries.controls; let i = index" [formGroupName]="i">
              <td>
                <select class="form-control" formControlName="productId">
                  <option [ngValue]="0" disabled>Product</option>
                  <option *ngFor="let product of products()" [ngValue]="product.id">{{ product.name }}</option>
                </select>
              </td>
              <td>
                <select class="form-control" formControlName="unitId">
                  <option [ngValue]="null">Any</option>
                  <option *ngFor="let unit of units()" [ngValue]="unit.id">{{ unit.name }}</option>
                </select>
              </td>
              <td><input type="number" class="form-control" formControlName="price" min="0" step="0.01" /></td>
              <td><input type="number" class="form-control" formControlName="minQuantity" min="0" step="0.001" /></td>
              <td>
                <button type="button" class="btn btn-link text-danger" (click)="removeEntry(i)">Remove</button>
              </td>
            </tr>
          </tbody>
        </table>
        <button type="button" class="btn btn-outline-primary btn-sm" (click)="addEntry()">Add entry</button>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
