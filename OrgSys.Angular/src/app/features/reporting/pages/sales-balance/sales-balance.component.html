<app-page-header title="Sales Balance" [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Reports' }, { label: 'Sales Balance' }]"></app-page-header>

<div class="card mb-3">
  <div class="card-body">
    <div class="row align-items-end">
      <div class="form-group col-6 col-md-4">
        <label>From date</label>
        <input type="date" class="form-control" [ngModel]="fromDate()" (ngModelChange)="fromDate.set($event)" />
      </div>
      <div class="form-group col-6 col-md-4">
        <label>To date</label>
        <input type="date" class="form-control" [ngModel]="toDate()" (ngModelChange)="toDate.set($event)" />
      </div>
      <div class="form-group col-12 col-md-4">
        <button type="button" class="btn btn-primary w-100" (click)="search()">Search</button>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body p-0">
    <table class="table table-hover m-0" *ngIf="rows().length; else emptyState">
      <thead>
        <tr>
          <th>Date</th>
          <th class="text-right">Sales</th>
          <th class="text-right">Returns</th>
          <th class="text-right">Net</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of rows()">
          <td>{{ row.date | date: 'yyyy-MM-dd' }}</td>
          <td class="text-right">{{ row.inAmount | number: '1.2-2' }}</td>
          <td class="text-right">{{ row.outAmount | number: '1.2-2' }}</td>
          <td class="text-right font-weight-bold">{{ row.net | number: '1.2-2' }}</td>
        </tr>
      </tbody>
    </table>

    <ng-template #emptyState>
      <p class="text-center text-muted p-4 mb-0">{{ loading() ? 'Loading...' : 'No sales found for this range.' }}</p>
    </ng-template>
  </div>
</div>

<div class="mt-3">
  <app-pagination [page]="page()" [pageCount]="pageCount()" (pageChange)="onPageChange($event)"></app-pagination>
</div>
