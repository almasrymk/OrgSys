<app-page-header title="Safe Balance" [breadcrumbs]="[{ label: 'Home', route: '/' }, { label: 'Reports' }, { label: 'Safe Balance' }]"></app-page-header>

<div class="card mb-3">
  <div class="card-body">
    <div class="row align-items-end">
      <div class="form-group col-6 col-md-4">
        <label>As of date</label>
        <input type="date" class="form-control" [ngModel]="toDate()" (ngModelChange)="toDate.set($event)" />
      </div>
      <div class="form-group col-6 col-md-4">
        <label>Safe</label>
        <select class="form-control" [ngModel]="cashBoxId()" (ngModelChange)="cashBoxId.set($event)">
          <option [ngValue]="0">All safes</option>
          <option *ngFor="let c of cashBoxes()" [ngValue]="c.id">{{ c.name }}</option>
        </select>
      </div>
      <div class="form-group col-12 col-md-4">
        <button type="button" class="btn btn-primary w-100" (click)="search()">Search</button>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body p-0">
    <table class="table table-hover m-0" *ngIf="rows().length; else emptyState">
      <thead>
        <tr>
          <th>Safe</th>
          <th class="text-right">Balance</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of rows()">
          <td>{{ row.safeName }}</td>
          <td class="text-right font-weight-bold" [class.text-danger]="row.balance < 0">{{ row.balance | number: '1.2-2' }}</td>
        </tr>
      </tbody>
    </table>

    <ng-template #emptyState>
      <p class="text-center text-muted p-4 mb-0">{{ loading() ? 'Loading...' : 'No safes found for this filter.' }}</p>
    </ng-template>
  </div>
</div>

<div class="mt-3">
  <app-pagination [page]="page()" [pageCount]="pageCount()" (pageChange)="onPageChange($event)"></app-pagination>
</div>
