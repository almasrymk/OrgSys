<nav *ngIf="pageCount() > 1" aria-label="Page navigation">
  <ul class="pagination justify-content-center mb-0">
    <li class="page-item" [class.disabled]="page() === 1">
      <button type="button" class="page-link" (click)="goTo(page() - 1)">&laquo;</button>
    </li>
    <li class="page-item" *ngFor="let p of pages()" [class.active]="p === page()">
      <button type="button" class="page-link" (click)="goTo(p)">{{ p }}</button>
    </li>
    <li class="page-item" [class.disabled]="page() === pageCount()">
      <button type="button" class="page-link" (click)="goTo(page() + 1)">&raquo;</button>
    </li>
  </ul>
</nav>
