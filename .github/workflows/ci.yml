name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: OrgSys.Angular/package-lock.json

      - name: Restore
        run: dotnet restore OrgSys.sln

      - name: Build
        run: dotnet build OrgSys.sln --no-restore -c Release

      - name: Architecture tests
        run: dotnet test Tests/Architecture.Tests/Architecture.Tests.csproj --no-build -c Release --verbosity minimal

      - name: Application tests
        run: dotnet test Tests/Application.Tests/Application.Tests.csproj --no-build -c Release --verbosity minimal

      - name: Domain tests
        run: |
          set -e
          for proj in Tests/*.Domain.Tests/*.csproj; do
            dotnet test "$proj" --no-build -c Release --verbosity minimal
          done

      - name: Angular build
        working-directory: OrgSys.Angular
        run: |
          npm ci
          npm run build
